<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HermesMed — Decks de Flashcards</title>
<script src="auth.js"></script>
<script src="tema.js"></script>
<style>
  :root {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --card2: #22223a;
    --accent: #7c5cfc;
    --accent2: #5ac8fa;
    --text: #e8e8f0;
    --muted: #8888a0;
    --radius: 20px;
    --border: rgba(124,92,252,0.12);
  }
  html[data-tema="claro"] {
    --bg: #f2f2f7;
    --card: #ffffff;
    --card2: #e9e9f0;
    --accent: #5b3fd4;
    --accent2: #0a84ff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --radius: 20px;
    --border: rgba(91,63,212,0.15);
    --shadow: 0 8px 24px rgba(0,0,0,0.10);
  }
  html[data-tema="escuro"] {
    --shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container { max-width: 640px; width: 100%; }

  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 8px 0 16px;
    width: 100%; max-width: 640px;
  }
  .topbar .back {
    font-size: 1.3rem; text-decoration: none; color: var(--text);
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; background: var(--card);
  }
  .topbar .info { flex: 1; }
  .topbar .info .title { font-weight: 600; }
  .topbar .info .sub { color: var(--muted); font-size: 0.8rem; }

  /* ─── Lista de decks ─── */
  .search {
    width: 100%; padding: 12px 16px; border-radius: 14px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-size: 0.95rem; margin-bottom: 20px; outline: none;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { border-color: var(--accent); }

  .tema-group { margin-bottom: 24px; }
  .tema-header {
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 700; font-size: 1.05rem; margin-bottom: 10px;
    padding-bottom: 6px; border-bottom: 2px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .tema-header:hover { color: var(--accent2); }
  .tema-header .chev {
    color: var(--muted); font-size: 0.8rem; margin-left: 8px;
    transition: transform 0.2s ease;
  }
  .tema-header .chev.aberto { transform: rotate(90deg); color: var(--accent); }
  .tema-header .count { color: var(--muted); font-weight: 500; font-size: 0.8rem; display: flex; align-items: center; }
  .tema-decks { display: none; }
  .tema-decks.aberto { display: block; }

  .deck {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
  }
  .deck:hover { border-color: var(--accent); transform: translateX(2px); }
  .deck .icon {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
  }
  .deck .meta { flex: 1; min-width: 0; }
  .deck .meta .name { font-weight: 600; font-size: 0.98rem; }
  .deck .meta .cards-info { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
  .deck .arrow { color: var(--muted); font-size: 1rem; }

  /* ─── View de deck (cards empilhados) ─── */
  .deck-head {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: var(--radius); padding: 20px;
    color: #fff; margin-bottom: 16px;
  }
  .deck-head .tema { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.85; }
  .deck-head .name { font-size: 1.25rem; font-weight: 700; margin: 4px 0; }
  .deck-head .cards-info { font-size: 0.85rem; opacity: 0.9; }

  .flashcard {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 12px; overflow: hidden;
    transition: border-color 0.2s;
  }
  .flashcard .front {
    padding: 18px 18px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px;
    font-size: 1rem; line-height: 1.55;
  }
  .flashcard .front .num {
    background: var(--card2); color: var(--muted);
    min-width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem; font-weight: 700; flex-shrink: 0; margin-top: 2px;
  }
  .flashcard .front .q-text { flex: 1; white-space: pre-wrap; word-break: break-word; }
  .flashcard .front .img-frente { flex-basis: 100%; margin-top: 10px; }
  .flashcard .front .img-frente img { max-width: 100%; border-radius: 10px; display: block; cursor: zoom-in; }
  .flashcard .front .chev {
    color: var(--muted); font-size: 0.8rem; margin-top: 4px;
    transition: transform 0.25s ease; flex-shrink: 0;
  }
  .flashcard.open .chev { transform: rotate(180deg); }
  .flashcard.open { border-color: var(--accent); }

  .flashcard .back {
    max-height: 0; overflow: hidden; transition: max-height 0.35s ease;
  }
  .flashcard.open .back { max-height: 3000px; }
  .flashcard .back-inner {
    padding: 0 18px 18px 58px; border-top: 1px dashed var(--border); padding-top: 14px;
    font-size: 0.95rem; line-height: 1.6; color: var(--text);
    white-space: pre-wrap; word-break: break-word;
  }
  .flashcard .back-inner .img-verso { margin-top: 12px; }
  .flashcard .back-inner .img-verso img {
    max-width: 100%; border-radius: 10px; display: block; cursor: zoom-in;
    border: 1px solid var(--border);
  }
  .flashcard .back-inner .label {
    font-size: 0.72rem; color: var(--accent2); text-transform: uppercase;
    letter-spacing: 1px; font-weight: 700; margin-bottom: 6px;
  }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }
  .empty-state .icon { font-size: 4rem; margin-bottom: 16px; }
  .empty-state h3 { color: var(--text); margin-bottom: 8px; }
  .empty-state p { font-size: 0.9rem; line-height: 1.6; }

  .hint {
    text-align: center; color: var(--muted); font-size: 0.78rem;
    margin: 14px 0 6px; opacity: 0.7;
  }

  @media (max-width: 500px) {
    .flashcard .front { padding: 15px 14px; }
    .flashcard .back-inner { padding-left: 48px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <a href="index.html" class="back">←</a>
    <div class="info">
      <div class="title" id="pageTitle">🃏 Decks de Flashcards</div>
      <div class="sub" id="pageSub">Conferida rápida</div>
    </div>
    <button onclick="hermesmedTema.toggle()" title="Alternar tema claro/escuro" style="background:none;border:none;font-size:1.1rem;cursor:pointer;padding:4px;">🌓</button>
  </div>

  <input class="search" id="busca" placeholder="🔍 Buscar deck por tema ou subárea..." oninput="mostrarLista(this.value)" style="display:none;">
  <div id="content"></div>
</div>

<script>
// ─── Decks de flashcards — conferida rápida (sem revisão espaçada) ───
const DECKS_URL = 'data/flashdecks.json';

let decks = [];
let deckSelecionado = null;
// temas expandidos na listagem (persistido)
let temasAbertos = new Set();
try { temasAbertos = new Set(JSON.parse(localStorage.getItem('hermesmed_temas_abertos') || '[]')); } catch {}

function toggleTema(tema) {
  if (temasAbertos.has(tema)) temasAbertos.delete(tema);
  else temasAbertos.add(tema);
  try { localStorage.setItem('hermesmed_temas_abertos', JSON.stringify([...temasAbertos])); } catch {}
  mostrarLista(document.getElementById('busca').value || '');
}

async function carregarDecks() {
  try {
    const resp = await fetch(DECKS_URL + '?cb=' + Date.now());
    if (!resp.ok) throw new Error('http ' + resp.status);
    const data = await resp.json();
    decks = data.decks || [];
  } catch {
    decks = [];
  }
  if (decks.length === 0) {
    mostrarVazio();
  } else {
    mostrarLista();
  }
}

function esc(t) {
  const div = document.createElement('div');
  div.textContent = t;
  return div.innerHTML;
}

// renderiza as imagens do card (array de caminhos); cls = classe do wrapper
function imgsHtml(paths, cls) {
  if (!paths || !paths.length) return '';
  return `<div class="${cls}">` +
    paths.map(p =>
      `<img src="${p}" loading="lazy" alt="" onclick="event.stopPropagation(); window.open('${p}','_blank')" title="Clique para ampliar">`
    ).join('') + '</div>';
}

function mostrarVazio() {
  document.getElementById('pageTitle').textContent = '🃏 Decks de Flashcards';
  document.getElementById('pageSub').textContent = 'Conferida rápida';
  document.getElementById('content').innerHTML = `
    <div class="empty-state">
      <div class="icon">📭</div>
      <h3>Nenhum deck por aqui ainda</h3>
      <p>Manda o primeiro tema pra mim pelo chat<br>
      (ex: <b>Cardiologia → ICC</b>) que eu monto o deck pra você! 💬</p>
    </div>`;
}

function mostrarLista(filtro = '') {
  document.getElementById('pageTitle').textContent = '🃏 Decks de Flashcards';
  document.getElementById('pageSub').textContent = `${decks.length} deck${decks.length === 1 ? '' : 's'} • conferida rápida`;

  // input de busca fica FORA do conteúdo re-renderizado (evita perder o foco a cada tecla)
  const input = document.getElementById('busca');
  input.style.display = 'block';
  if (document.activeElement !== input) input.value = filtro;

  const q = filtro.toLowerCase().trim();
  // quando busca ativa, abre todos os grupos pra mostrar resultados
  const forcaAberto = q.length > 0;
  const grupos = {};
  for (const d of decks) {
    if (q && !(`${d.tema} ${d.subarea}`.toLowerCase().includes(q))) continue;
    const tema = d.tema || 'Geral';
    (grupos[tema] = grupos[tema] || []).push(d);
  }

  const temas = Object.keys(grupos);
  if (temas.length === 0) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <h3>Nada encontrado pra "${esc(filtro)}"</h3>
        <p>Que tal revisar a busca?</p>
      </div>`;
    return;
  }

  let html = '';

  for (const tema of temas) {
    const g = grupos[tema];
    const total = g.reduce((s, d) => s + d.cards.length, 0);
    const aberto = forcaAberto || temasAbertos.has(tema);
    html += `<div class="tema-group">
      <div class="tema-header" onclick="toggleTema('${esc(tema)}')">
        <span>📚 ${esc(tema)}<span class="chev ${aberto ? 'aberto' : ''}">▸</span></span>
        <span class="count">${g.length} deck${g.length === 1 ? '' : 's'} • ${total} cards</span>
      </div>
      <div class="tema-decks ${aberto ? 'aberto' : ''}">`;
    for (const d of g) {
      html += `<div class="deck" onclick="abrirDeck('${d.id}')">
        <div class="icon">🃏</div>
        <div class="meta">
          <div class="name">${esc(d.subarea || 'Sem subárea')}</div>
          <div class="cards-info">${d.cards.length} card${d.cards.length === 1 ? '' : 's'}</div>
        </div>
        <span class="arrow">›</span>
      </div>`;
    }
    html += `</div></div>`;
  }
  document.getElementById('content').innerHTML = html;
}

function abrirDeck(id) {
  const d = decks.find(x => x.id === id);
  if (!d) return;
  deckSelecionado = d;
  document.getElementById('busca').style.display = 'none';
  document.getElementById('pageTitle').textContent = '🃏 ' + (d.subarea || d.tema || 'Deck');
  document.getElementById('pageSub').textContent = d.tema ? `${d.tema} • ${d.cards.length} cards` : `${d.cards.length} cards`;

  let html = `<div class="deck-head">
      <div class="tema">${esc(d.tema || '')}</div>
      <div class="name">${esc(d.subarea || d.tema || 'Deck')}</div>
      <div class="cards-info">${d.cards.length} cards • rola pra ver tudo, clica pra revelar a resposta</div>
    </div>`;

  d.cards.forEach((c, i) => {
    html += `<div class="flashcard" id="fc-${i}" onclick="toggleCard(${i})">
      <div class="front">
        <span class="num">${i + 1}</span>
        <span class="q-text">${esc(c.frente || '')}${imgsHtml(c.img_frente, 'img-frente')}</span>
        <span class="chev">▾</span>
      </div>
      <div class="back"><div class="back-inner"><div class="label">💡 Resposta</div>${esc(c.verso || '')}${imgsHtml(c.img_verso, 'img-verso')}</div></div>
    </div>`;
  });

  html += `<div class="hint">💬 Faltou algum card? Manda pra mim que eu adiciono!</div>
           <div style="text-align:center;margin-top:14px;">
             <button onclick="mostrarLista()" style="background:var(--card);color:var(--text);border:1px solid var(--border);padding:10px 18px;border-radius:12px;font-size:0.9rem;cursor:pointer;">← Voltar aos decks</button>
           </div>`;
  document.getElementById('content').innerHTML = html;
  window.scrollTo({ top: 0 });
}

function toggleCard(i) {
  const el = document.getElementById('fc-' + i);
  if (!el) return;
  const aberto = el.classList.contains('open');
  // Fecha os outros (acordeão)
  document.querySelectorAll('.flashcard.open').forEach(f => f.classList.remove('open'));
  if (!aberto) el.classList.add('open');
}

// Atalho: Esc volta pra lista
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && deckSelecionado) {
    deckSelecionado = null;
    mostrarLista();
  }
});

carregarDecks();
</script>
</body>
</html>
